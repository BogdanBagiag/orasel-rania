<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#7ad3c0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Rania">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="icons/favicon-48.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<title>Orășelul Rania</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#2d2a4a;--mint:#7ad3c0;--sun:#ffd35c;--coral:#ff7f6b;--sky:#6ec1ff;--berry:#c46bd6;--card:#fffdf7;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;font-family:'Fredoka','Baloo 2','Nunito',system-ui,sans-serif;color:var(--ink);background:#8ad06f;touch-action:manipulation;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
#game{position:fixed;inset:0;touch-action:none}
canvas{display:block}
input{font-family:inherit;-webkit-user-select:text;user-select:text}
.btn{font:inherit;font-weight:600;border:3px solid var(--ink);border-radius:18px;padding:9px 16px;background:#fff;color:var(--ink);box-shadow:0 4px 0 var(--ink);cursor:pointer;font-size:18px;line-height:1.1}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn.sun{background:var(--sun)}
.btn.go{background:var(--coral);color:#fff}
.btn.sky{background:var(--sky)}
.btn.on{background:var(--sun)}
.btn.sm{padding:6px 11px;font-size:15px;border-radius:14px;box-shadow:0 3px 0 var(--ink)}

/* MENU */
#menu{position:fixed;inset:0;z-index:50;overflow:auto;padding:max(12px,var(--sat)) 12px max(12px,var(--sab));display:flex;background:linear-gradient(180deg,#8fe3d1 0%,#b9ecff 60%,#d9f6ff 100%)}
#menu:before,#menu:after{content:"";position:fixed;border-radius:50%;background:rgba(255,255,255,.55);z-index:-1}
#menu:before{width:260px;height:90px;top:6%;left:-40px;box-shadow:120px 40px 0 -10px rgba(255,255,255,.55)}
#menu:after{width:220px;height:80px;bottom:8%;right:-30px}
.mcard{background:var(--card);border:3px solid var(--ink);border-radius:28px;box-shadow:0 8px 0 var(--ink);padding:18px;max-width:780px;width:100%;margin:auto}
.mtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mtop h1{margin:0;font-size:clamp(26px,6vw,40px);line-height:1;letter-spacing:.2px}
.mtop p{margin:4px 0 0;font-size:15px;opacity:.75}
.lang{display:flex;gap:6px}
.mgrid{display:grid;grid-template-columns:190px 1fr;gap:18px}
@media(max-width:640px){.mgrid{grid-template-columns:1fr}}
.prev{display:flex;flex-direction:column;align-items:center;gap:10px}
.prevbox{width:170px;height:210px;border:3px solid var(--ink);border-radius:24px;background:linear-gradient(#dff7ff,#c8f0c0);display:flex;align-items:center;justify-content:center}
.prevbox canvas{width:128px;height:160px}
.opts label{display:block;font-weight:600;font-size:15px;margin:10px 0 5px}
.opts label:first-child{margin-top:0}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--ink);cursor:pointer;padding:0}
.sw.on{outline:4px solid var(--sun);outline-offset:1px}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;font-size:20px;font-weight:600;padding:9px 12px;border:3px solid var(--ink);border-radius:16px;background:#fff;color:var(--ink)}
.help{font-size:13px;opacity:.7;margin-top:5px}
.err{color:#c0392b;font-weight:600;font-size:14px;min-height:18px;margin-top:6px}
#play{width:100%;margin-top:6px;font-size:24px;padding:14px}

/* HUD */
#hud{position:fixed;inset:0;z-index:10;pointer-events:none}
#hud>*{pointer-events:auto}
#topbar{position:absolute;top:calc(8px + var(--sat));left:8px;right:8px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
#topbar>*{pointer-events:auto}
.pill{background:rgba(255,253,247,.95);border:3px solid var(--ink);border-radius:16px;padding:5px 12px;font-weight:600;font-size:15px;display:flex;align-items:center;gap:8px}
#dot{width:12px;height:12px;border-radius:50%;background:#bbb;border:2px solid var(--ink)}
#dot.ok{background:#4cd964}#dot.bad{background:#ff5a5a}
.hbtns{display:flex;gap:6px}
.hbtns .btn{padding:5px 10px;font-size:17px}
#btnChat{position:absolute;right:12px;bottom:calc(20px + var(--sab));width:62px;height:62px;border-radius:50%;font-size:28px;padding:0;background:var(--sky)}
#chatDot{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:var(--coral);border:3px solid var(--ink);display:none}
#enterBtn{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(26px + var(--sab));font-size:22px;padding:12px 22px;display:none;white-space:nowrap}
#enterBtn:active{transform:translateX(-50%) translateY(3px)}
#joy{position:absolute;left:18px;bottom:calc(18px + var(--sab));width:120px;height:120px;border-radius:50%;background:rgba(255,253,247,.5);border:3px solid rgba(45,42,74,.55);touch-action:none;display:none}
#knob{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--sun);border:3px solid var(--ink);pointer-events:none}
#chatPanel{position:absolute;right:10px;bottom:calc(92px + var(--sab));width:min(330px,calc(100vw - 20px));background:var(--card);border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);display:none;flex-direction:column;overflow:hidden}
#chatPanel .ch{display:flex;justify-content:space-between;align-items:center;padding:7px 10px;background:var(--sky);border-bottom:3px solid var(--ink);font-weight:700}
#chatLog{height:150px;overflow:auto;padding:8px 10px;font-size:15px;-webkit-user-select:text;user-select:text}
#chatLog .ln{margin:2px 0;word-break:break-word}
#chatLog .ln b{color:#7a3fb0}
#chatLog .ln.me b{color:#e0562f}
.quick{display:flex;gap:6px;padding:0 10px 6px;flex-wrap:wrap}
.quick button{font-size:21px;border:2px solid var(--ink);background:#fff;border-radius:12px;padding:2px 7px;cursor:pointer}
#chatForm{display:flex;gap:6px;padding:0 10px 10px}
#chatForm input{flex:1;min-width:0;font-size:17px;padding:8px 10px;border:3px solid var(--ink);border-radius:14px}
#toast{position:fixed;left:50%;top:calc(64px + var(--sat));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 16px;border-radius:14px;font-weight:600;font-size:16px;z-index:70;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw;text-align:center}
#toast.show{opacity:1}

/* MODAL */
#modal{position:fixed;inset:0;background:rgba(45,42,74,.55);display:none;align-items:center;justify-content:center;z-index:40;padding:10px}
#mbody{background:var(--card);border:3px solid var(--ink);border-radius:26px;box-shadow:0 8px 0 var(--ink);padding:14px 16px 18px;width:min(560px,100%);max-height:calc(100dvh - 20px);overflow:auto;position:relative}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mh h2{margin:0;font-size:24px}
.mh .btn{padding:4px 11px;font-size:18px}
.msg{min-height:28px;text-align:center;font-weight:700;font-size:19px;margin-top:8px}
.cust{display:flex;align-items:center;gap:10px;margin:6px 0}
.face{font-size:54px;line-height:1}
.bub{position:relative;background:#fff;border:3px solid var(--ink);border-radius:18px;padding:9px 13px;font-size:19px;font-weight:600;flex:1}
.bub:before{content:"";position:absolute;left:-12px;top:20px;border:8px solid transparent;border-right-color:var(--ink);border-left:0}
.menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.menu .item{display:flex;flex-direction:column;align-items:center;font-size:34px;padding:8px 2px}
.menu .item small{font-size:12px;font-weight:600;margin-top:2px}
.tray{min-height:74px;border:3px dashed var(--ink);border-radius:18px;background:#fff6dd;padding:6px;display:flex;flex-wrap:wrap;gap:2px;align-content:flex-start;margin-bottom:10px}
.tray button{font-size:28px;background:none;border:0;padding:0 2px;cursor:pointer}
.cakewrap svg{width:100%;max-height:250px;touch-action:manipulation}
.pal{display:flex;flex-wrap:wrap;gap:7px;margin:4px 0 8px;align-items:center}
.pal .lab{font-weight:600;font-size:14px;min-width:78px}
.pal .e{font-size:26px;padding:2px 8px;border:3px solid var(--ink);border-radius:14px;background:#fff;cursor:pointer;line-height:1.2}
.pal .e.on{background:var(--sun)}
.chal{background:#fff6dd;border:3px solid var(--ink);border-radius:14px;padding:6px 10px;font-weight:600;font-size:16px;margin-bottom:6px}
.hop{display:flex;flex-direction:column-reverse;align-items:center;gap:6px;margin:10px 0}
.hrow{display:flex;gap:6px}
.sq{width:78px;height:60px;border:3px solid var(--ink);border-radius:12px;background:#fff;font-size:26px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;position:relative}
.sq.done{background:#9be39b}
.sq img{position:absolute;width:44px;height:55px;top:-14px}
.sq.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.pets{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.pets .pet{display:flex;flex-direction:column;align-items:center;font-size:56px;padding:12px 4px;line-height:1.1}
.pets .pet small{font-size:16px;font-weight:600;margin-top:4px}
.quiz{display:flex;gap:10px;justify-content:center;margin-top:8px}
.quiz .btn{font-size:26px;min-width:64px}
.conf{position:fixed;top:-40px;font-size:30px;z-index:90;pointer-events:none;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg);opacity:.9}}
@media(prefers-reduced-motion:reduce){.conf{display:none}}
.xo-head{display:flex;gap:8px;margin:6px 0}
.xo-who{flex:1;border:3px solid var(--ink);border-radius:16px;padding:6px 8px;text-align:center;font-weight:700;background:#fff;font-size:15px;line-height:1.25}
.xo-who.on{background:var(--sun)}
.xo-who b{display:block;font-size:26px}
.xo-status{text-align:center;font-weight:700;font-size:19px;min-height:30px;margin:6px 0}
.xo-board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:330px;margin:6px auto}
.xo-cell{aspect-ratio:1;border:3px solid var(--ink);border-radius:18px;background:#fff;font-family:inherit;font-weight:700;font-size:clamp(44px,14vw,70px);line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0;box-shadow:0 4px 0 var(--ink);color:var(--ink)}
.xo-cell:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.xo-cell.x{color:#ff5c6c}.xo-cell.o{color:#2a9df4}.xo-cell.win{background:#9be39b}
.xo-cell:disabled{cursor:default}
.peerlist{display:flex;flex-direction:column;gap:8px;margin:8px 0}
.peerlist .btn{font-size:21px;text-align:left}
</style>
</head>
<body>
<div id="game"></div>

<!-- MENU -->
<div id="menu">
  <div class="mcard">
    <div class="mtop">
      <div><h1 id="mTitle">Orășelul Rania</h1><p id="mSub"></p></div>
      <div class="lang"><button class="btn sm" data-lang="ro">RO</button><button class="btn sm" data-lang="en">EN</button></div>
    </div>
    <div class="mgrid">
      <div class="prev">
        <div class="prevbox"><canvas id="prev" width="128" height="160"></canvas></div>
        <button class="btn sun sm" id="btnRania">⭐ Rania</button>
      </div>
      <div class="opts">
        <label id="lName"></label>
        <div class="field"><input id="inName" maxlength="16" autocomplete="off"><button class="btn sky" id="btnDice" title="🎲">🎲</button></div>
        <label id="lSkin"></label><div class="row" id="swSkin"></div>
        <label id="lStyle"></label><div class="row" id="chStyle"></div>
        <label id="lHair"></label><div class="row" id="swHair"></div>
        <label id="lShirt"></label><div class="row" id="swShirt"></div>
        <label id="lAcc"></label><div class="row" id="chAcc"></div>
        <label id="lRoom"></label>
        <div class="field"><input id="inRoom" maxlength="16" autocomplete="off" autocapitalize="characters"></div>
        <div class="help" id="roomHelp"></div>
      </div>
    </div>
    <div class="err" id="menuErr"></div>
    <button class="btn go" id="play"></button>
    <div class="row" style="justify-content:center;margin-top:12px"><button class="btn sky sm" id="btnInstall" style="display:none"></button></div>
    <div class="help" id="iosHint" style="display:none;text-align:center;margin-top:8px"></div>
  </div>
</div>

<!-- HUD -->
<div id="hud" style="display:none">
  <div id="topbar">
    <div class="pill"><span id="dot"></span><span id="roomTxt"></span><span>👥 <b id="cnt">1</b></span><span id="dbg" style="font-size:11px;opacity:.6"></span></div>
    <div class="hbtns">
      <button class="btn sm" id="btnLang">RO</button>
      <button class="btn sm" id="btnVoice">🔊</button>
      <button class="btn sm" id="btnMenu">⚙️</button>
    </div>
  </div>
  <div id="joy"><div id="knob"></div></div>
  <button class="btn go" id="enterBtn"></button>
  <button class="btn" id="btnChat">💬<i id="chatDot"></i></button>
  <div id="chatPanel">
    <div class="ch"><span id="chTitle"></span><button class="btn sm" id="btnHide">🙈</button></div>
    <div id="chatLog"></div>
    <div class="quick" id="quick"></div>
    <form id="chatForm" autocomplete="off"><input id="chatIn" maxlength="80"><button class="btn sun sm" id="chatSend" type="submit"></button></form>
  </div>
</div>

<div id="modal"><div id="mbody"></div></div>
<div id="toast"></div>

const pressed = {};
const joy = { x: 0, y: 0, on: false };
let target = null, pending = null, nearLoc = null;

function ensureAvatar(a) {
  const key = 'av' + [a.sk, a.hc, a.hs, a.sh, a.ac].join('').replace(/#/g, '');
  const k0 = key + '_0', k1 = key + '_1';
  if (!scene.textures.exists(k0)) { scene.textures.addCanvas(k0, avatarCanvas(a, 0)); scene.textures.addCanvas(k1, avatarCanvas(a, 1)); }
  return [k0, k1];
}
function makePlayer(id, name, av, pet, x, y) {
  const keys = ensureAvatar(av);
  const p = { id, name, av, pet: '', keys, x, y, tx: x, ty: y, step: 0, stepT: 0, moving: false, flip: false, shown: true, bubUntil: 0 };
  p.sprite = scene.add.sprite(x, y, keys[0]).setOrigin(.5, .93).setScale(SCALE / 2);
  p.label = scene.add.text(x, y, name, { fontFamily: FONT, fontSize: '14px', fontStyle: '700', color: '#ffffff', stroke: '#2d2a4a', strokeThickness: 4, resolution: 2 }).setOrigin(.5, 1).setDepth(2000);
  setPet(p, pet);
  return p;
}
function setPet(p, pet) {
  pet = cleanPet(pet);
  if (p.pet === pet) return;
  p.pet = pet;
  if (p.petT) { p.petT.destroy(); p.petT = null; }
  if (pet) {
    p.petX = p.x - 30; p.petY = p.y + 6;
    p.petT = scene.add.text(p.petX, p.petY, PETS[pet], { fontFamily: FONT, fontSize: '30px', resolution: 2 }).setOrigin(.5, 1);
  }
}
function setAvatar(p, av) {
  p.av = av; p.keys = ensureAvatar(av); p.sprite.setTexture(p.keys[0]);
}
function showBubble(p, text) {
  if (!p.bubT) {
    p.bubG = scene.add.graphics().setDepth(2001);
    p.bubT = scene.add.text(0, 0, '', { fontFamily: FONT, fontSize: '16px', fontStyle: '600', color: '#2d2a4a', wordWrap: { width: 190 }, align: 'center', resolution: 2 }).setOrigin(.5, 1).setDepth(2002);
  }
  p.bubT.setText(text); p.bubT.setVisible(true); p.bubG.setVisible(true);
  p.bubUntil = scene.time.now + 3500 + text.length * 70;
}
function destroyPlayer(p) {
  ['sprite', 'label', 'petT', 'bubT', 'bubG'].forEach(k => { if (p[k]) { p[k].destroy(); p[k] = null; } });
}
function placeLabels(p, now) {
  const bob = p.moving ? Math.abs(Math.sin(now / 90)) * 3 : 0;
  p.sprite.setPosition(p.x, p.y - bob).setDepth(p.y).setFlipX(p.flip);
  p.label.setPosition(p.x, p.y - 80 * SCALE - 4);
  if (p.petT) {
    const dx = p.x - p.petX, dy = p.y - p.petY, d = Math.hypot(dx, dy);
    if (d > 48) { const k = 1 - Math.exp(-scene.game.loop.delta / 200); p.petX += dx * k; p.petY += dy * k; }
    const pm = d > 52;
    const bobP = p.pet === 'fish' ? Math.sin(now / 350) * 5 - 12 : (pm ? -Math.abs(Math.sin(now / 100)) * 5 : 0);
    p.petT.setPosition(p.petX, p.petY + bobP).setDepth(p.petY);
  }
  if (p.bubT) {
    if (now > p.bubUntil) { p.bubT.setVisible(false); p.bubG.setVisible(false); }
    else {
      const w = p.bubT.width + 18, h = p.bubT.height + 12, by = p.y - 80 * SCALE - 26;
      p.bubT.setPosition(p.x, by - 6);
      p.bubG.clear().fillStyle(0xffffff).fillRoundedRect(p.x - w / 2, by - h, w, h, 12).lineStyle(3, 0x2d2a4a, .8).strokeRoundedRect(p.x - w / 2, by - h, w, h, 12)
        .fillStyle(0xffffff).fillTriangle(p.x - 6, by - 1, p.x + 6, by - 1, p.x, by + 9);
    }
  }
}
function animate(p, dt) {
  if (p.moving) { p.stepT += dt; if (p.stepT > 150) { p.stepT = 0; p.step ^= 1; p.sprite.setTexture(p.keys[p.step]); } }
  else if (p.step) { p.step = 0; p.sprite.setTexture(p.keys[0]); }
}

function fitCamera() {
  if (!scene) return;
  const w = scene.scale.width, h = scene.scale.height;
  scene.cameras.main.setZoom(Phaser.Math.Clamp(Math.min(w, h) / 540, 0.65, 1.7));
}
function onCreate() {
  scene = this;
  drawWorld(this);
  const cam = this.cameras.main;
  cam.setBounds(0, 0, WORLD_W, WORLD_H); cam.setRoundPixels(true); cam.centerOn(900, 640);
  fitCamera(); this.scale.on('resize', fitCamera);
  this.input.on('pointerdown', ptr => {
    if (!session || modalOpen) return;
    closeChat();
    const wx = ptr.worldX, wy = ptr.worldY;
    for (const l of LOCS) {
      if (l.hit(wx, wy)) {
        if (l.locked) { toast(t('soon')); return; }
        pending = l.id; target = { x: l.door.x, y: l.door.y }; marker(l.door.x, l.door.y); return;
      }
    }
    pending = null; target = { x: Phaser.Math.Clamp(wx, 24, WORLD_W - 24), y: Phaser.Math.Clamp(wy, 40, WORLD_H - 24) }; marker(wx, wy);
  });
  uiReady = true;
}
function marker(x, y) {
  const c = scene.add.circle(x, y, 14, 0xffffff, 0).setStrokeStyle(4, 0xff7f6b).setDepth(5);
  scene.tweens.add({ targets: c, scale: 1.8, alpha: 0, duration: 450, onComplete: () => c.destroy() });
}
function onUpdate(time, delta) {
  if (!session) return;
  const dt = delta, me = session.me, now = time;
  // intrare de la tastatură / joystick / țintă
  let vx = 0, vy = 0;
  if (!modalOpen) {
    if (joy.on && (Math.abs(joy.x) > .12 || Math.abs(joy.y) > .12)) { vx = joy.x; vy = joy.y; target = null; pending = null; }
    else if (pressed.ArrowLeft || pressed.KeyA || pressed.ArrowRight || pressed.KeyD || pressed.ArrowUp || pressed.KeyW || pressed.ArrowDown || pressed.KeyS) {
      vx = ((pressed.ArrowRight || pressed.KeyD) ? 1 : 0) - ((pressed.ArrowLeft || pressed.KeyA) ? 1 : 0);
      vy = ((pressed.ArrowDown || pressed.KeyS) ? 1 : 0) - ((pressed.ArrowUp || pressed.KeyW) ? 1 : 0);
      target = null; pending = null;
    } else if (target) {
      const dx = target.x - me.x, dy = target.y - me.y, d = Math.hypot(dx, dy);
      if (d < 7) { target = null; if (pending) { const id = pending; pending = null; openLoc(id); } }
      else { vx = dx / d; vy = dy / d; }
    }
  }
  const mv = Math.hypot(vx, vy);
  me.moving = false;
  if (mv > .05) {
    if (mv > 1) { vx /= mv; vy /= mv; }
    const sp = 205 * dt / 1000, nx = me.x + vx * sp, ny = me.y + vy * sp;
    let moved = false;
    if (!blocked(nx, ny)) { me.x = nx; me.y = ny; moved = true; }
    else if (!blocked(nx, me.y) && Math.abs(vx) > .1) { me.x = nx; moved = true; }
    else if (!blocked(me.x, ny) && Math.abs(vy) > .1) { me.y = ny; moved = true; }
    else if (target) { session.stuck = (session.stuck || 0) + 1; if (session.stuck > 12) { target = null; pending = null; session.stuck = 0; } }
    if (moved) { session.stuck = 0; me.moving = true; if (Math.abs(vx) > .2) me.flip = vx < 0; }
    me.x = Phaser.Math.Clamp(me.x, 24, WORLD_W - 24); me.y = Phaser.Math.Clamp(me.y, 40, WORLD_H - 24);
  }
  animate(me, dt); placeLabels(me, now);
  // aproape de o locație?
  let nl = null;
  for (const l of LOCS) { if (!l.locked && Math.hypot(me.x - l.door.x, me.y - l.door.y) < l.r) { nl = l; break; } }
  if (nl !== nearLoc) { nearLoc = nl; const b = $('#enterBtn'); if (nl && !modalOpen) { b.textContent = nl.emoji + ' ' + t('enter') + ' – ' + t(nl.key); b.style.display = 'block'; } else b.style.display = 'none'; }
  // jucători la distanță
  for (const id in session.remotes) {
    const r = session.remotes[id];
    if (!r.sprite) continue;
    r.sprite.setVisible(r.shown); r.label.setVisible(r.shown); if (r.petT) r.petT.setVisible(r.shown);
    if (!r.shown) continue;
    const k = 1 - Math.exp(-dt / 90);
    const ox = r.x, oy = r.y;
    r.x += (r.tx - r.x) * k; r.y += (r.ty - r.y) * k;
    r.moving = Math.hypot(r.x - ox, r.y - oy) > .25;
    animate(r, dt); placeLabels(r, now);
  }
  netTick(now);
}

/* ============================================================
   REȚEA – Supabase Realtime (fără tabele, fără date salvate)
   ============================================================ */
const posCache = {}; let hb = null; const dbg = { s: 0, r: 0 };
let sb = null, chan = null, netOk = false, lastSent = { x: -999, y: -999 }, lastSentT = 0, wasMoving = false, lastChatT = 0;
window.addEventListener('pagehide', () => { try { if (chan) chan.untrack(); if (sb && chan) sb.removeChannel(chan); } catch (e) {} });
function myPresence() { return { n: S.name, a: S.av, p: S.pet || '' }; }
function setNet(ok) { netOk = ok; $('#dot').className = ok ? 'ok' : 'bad'; $('#dot').title = ok ? t('online') : t('offline'); }
function connect() {
  setNet(false);
  if (typeof supabase === 'undefined') { toast(t('offline')); return; }
  try {
    sb = sb || supabase.createClient(SUPA_URL, SUPA_KEY, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false }, realtime: { params: { eventsPerSecond: 20 } } });
  } catch (e) { toast(t('offline')); return; }
  chan = sb.channel('rania:' + S.room, { config: { broadcast: { self: false, ack: false }, presence: { key: S.id } } });
  chan.on('presence', { event: 'sync' }, onSync)
      .on('presence', { event: 'join' }, ({ key }) => { if (key !== S.id) sendPos(true); })
      .on('broadcast', { event: 'p' }, ({ payload }) => onPos(payload))
      .on('broadcast', { event: 'c' }, ({ payload }) => onChat(payload))
      .on('broadcast', { event: 'g' }, ({ payload }) => onGame(payload))
      .subscribe(async status => {
        if (!session) return;
        if (status === 'SUBSCRIBED') { setNet(true); try { await chan.track(myPresence()); } catch (e) {} sendPos(true); }
        else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') { setNet(false); }
      });
  clearInterval(hb); hb = setInterval(() => { if (session && netOk) { sendPos(); onSync(); } const e = $('#dbg'); if (e) e.textContent = '↑' + dbg.s + ' ↓' + dbg.r + ' ' + Object.keys(session ? session.remotes : {}).length + 'p'; }, 1500);
  setTimeout(() => { if (session && !netOk) toast(t('offline')); }, 7000);
}
function disconnect() {
  try { if (sb && chan) sb.removeChannel(chan); } catch (e) {}
  chan = null; clearInterval(hb); for (const k in posCache) delete posCache[k]; setNet(false);
}
function onSync() {
  if (!session || !chan) return;
  const st = chan.presenceState(), ids = Object.keys(st);
  $('#cnt').textContent = ids.length;
  if (ids.length > MAX_PLAYERS) {
    const sorted = ids.slice().sort(); if (sorted.indexOf(S.id) >= MAX_PLAYERS) { toast(t('full')); backToMenu(); return; }
  }
  ids.forEach(id => {
    if (id === S.id) return;
    const m = st[id][st[id].length - 1] || {};
    const av = cleanAv(m.a), nm = cleanText(m.n, 16) || '???', pet = cleanPet(m.p);
    let r = session.remotes[id];
    if (!r) { r = makePlayer(id, nm, av, pet, 900, 640); r.shown = false; session.remotes[id] = r; if (posCache[id]) { const pc = posCache[id]; delete posCache[id]; onPos(pc); } sendPos(true); }
    else {
      if (JSON.stringify(r.av) !== JSON.stringify(av)) setAvatar(r, av);
      if (r.name !== nm) { r.name = nm; r.label.setText(nm); }
      setPet(r, pet);
    }
  });
  const nowT = performance.now();
  Object.keys(session.remotes).forEach(id => { const rm = session.remotes[id]; if (st[id]) { rm.gone = 0; } else { if (!rm.gone) rm.gone = nowT; if (nowT - rm.gone > 6000) { destroyPlayer(rm); delete session.remotes[id]; } } });
}
function onPos(d) {
  if (!session || !d) return; dbg.r++;
  const r = session.remotes[d.i]; if (!r) { if (d.i) posCache[d.i] = d; return; }
  const x = +d.x, y = +d.y; if (!isFinite(x) || !isFinite(y)) return;
  r.tx = Phaser.Math.Clamp(x, 0, WORLD_W); r.ty = Phaser.Math.Clamp(y, 0, WORLD_H); r.flip = !!d.f;
  if (!r.shown) { r.x = r.tx; r.y = r.ty; r.shown = true; if (r.petT) { r.petX = r.x - 30; r.petY = r.y; } }
}
function sendPos(force) {
  if (!chan || !netOk || !session) return; dbg.s++;
  const m = session.me;
  chan.send({ type: 'broadcast', event: 'p', payload: { i: S.id, x: Math.round(m.x), y: Math.round(m.y), f: m.flip ? 1 : 0 } });
  lastSent = { x: m.x, y: m.y }; lastSentT = performance.now();
}
function netTick(now) {
  if (!chan || !netOk) return;
  const m = session.me, t0 = performance.now();
  const moved = Math.abs(m.x - lastSent.x) > 1 || Math.abs(m.y - lastSent.y) > 1;
  if ((moved && t0 - lastSentT > 100) || (wasMoving && !m.moving) || t0 - lastSentT > 1500) sendPos();
  wasMoving = m.moving;
}
function onChat(d) {
  if (!session || !d) return;
  const text = cleanText(d.t, 80); if (!text) return;
  if (S.hideChat) return;
  const r = session.remotes[d.i];
  const nm = r ? r.name : cleanText(d.n, 16);
  if (r) showBubble(r, text);
  logChat(nm, text, false);
}
function sendChat(text) {
  text = cleanText(text, 80); if (!text || !session) return;
  const n = performance.now(); if (n - lastChatT < 700) return; lastChatT = n;
  showBubble(session.me, text); logChat(S.name, text, true);
  if (chan && netOk) chan.send({ type: 'broadcast', event: 'c', payload: { i: S.id, n: S.name, t: text } });
}

/* ---- CAFENEA: comenzi (numărat + adunat) ---- */
function gCafe() {
  const ITEMS = [{ k: 'lemonade', e: '🍹' }, { k: 'shake', e: '🥤' }, { k: 'juice', e: '🧃' }, { k: 'cocoa', e: '☕' }];
  const FACES = ['👧', '👦', '👵', '👴', '🧑', '👩'];
  let served = 0, order = [], tray = [], face = '👧', busy = false;
  function newOrder() {
    const lvl = Math.min(3, 1 + Math.floor(served / 3)), maxN = lvl === 1 ? 5 : lvl === 2 ? 4 : 6;
    const items = shuffle(ITEMS).slice(0, lvl === 1 ? 1 : 2);
    order = items.map(i => ({ k: i.k, e: i.e, n: 1 + Math.floor(Math.random() * maxN) }));
    tray = []; face = pick(FACES); busy = false; render();
    const sp = order.map(o => o.n + ' ' + t(o.k)).join(' ' + t('and') + ' ');
    speak(t('want') + ' ' + sp + ', ' + t('please'));
  }
  function render() {
    const txt = t('want') + ' ' + order.map(o => `<b>${o.n}</b> ${o.e}`).join(' ' + t('and') + ' ') + ', ' + t('please') + '!';
    mbody.innerHTML = `<div class="cust"><div class="face">${face}</div><div class="bub">${txt}</div></div>
      <div class="menu">${ITEMS.map(i => `<button class="btn item" data-k="${i.k}">${i.e}<small>${t(i.k)}</small></button>`).join('')}</div>
      <div class="tray" id="tray"></div>
      <div class="row" style="justify-content:space-between"><button class="btn" id="clr">🗑️ ${t('clear')}</button><button class="btn go" id="srv">${t('serve')} ✔</button></div>
      <div class="msg" id="msg"></div>`;
    head('☕', t('cafe'));
    mbody.querySelectorAll('.item').forEach(b => b.onclick = () => { if (busy || tray.length >= 16) return; const it = ITEMS.find(i => i.k === b.dataset.k); tray.push(it); drawTray(); });
    $('#clr').onclick = () => { if (busy) return; tray = []; drawTray(); };
    $('#srv').onclick = serve; drawTray();
  }
  function drawTray() {
    const tr = $('#tray'); tr.innerHTML = '';
    tray.forEach((it, i) => { const b = document.createElement('button'); b.textContent = it.e; b.onclick = () => { if (busy) return; tray.splice(i, 1); drawTray(); }; tr.appendChild(b); });
  }
  function serve() {
    if (busy) return;
    const ok = order.every(o => tray.filter(x => x.k === o.k).length === o.n) && tray.length === order.reduce((s, o) => s + o.n, 0);
    const msg = $('#msg');
    if (!ok) { msg.textContent = t('again'); speak(t('again')); return; }
    busy = true; served++; burst();
    const total = order.reduce((s, o) => s + o.n, 0);
    if (order.length < 2) { msg.textContent = t('great'); speak(t('great')); setTimeout(newOrder, 1700); return; }
    msg.innerHTML = `${t('great')}<br><span style="font-size:17px">${t('howMany')}</span><div class="quiz" id="qz"></div>`;
    speak(t('howMany'));
    const opts = shuffle([total, total + 1, total - 1 > 0 ? total - 1 : total + 2].filter((v, i, a) => a.indexOf(v) === i)).slice(0, 3);
    if (!opts.includes(total)) opts[0] = total;
    shuffle(opts).forEach(v => { const b = document.createElement('button'); b.className = 'btn sky'; b.textContent = v; b.onclick = () => { if (v === total) { burst(); msg.textContent = t('great'); speak(t('great')); setTimeout(newOrder, 1500); } else { b.style.opacity = .4; b.disabled = true; speak(t('again')); } }; $('#qz').appendChild(b); });
  }
  newOrder();
}

      <div class="cakewrap">${cakeSvg()}</div>
      <div class="msg" style="font-size:15px;min-height:20px">${t('tapCake')}</div>
      <div class="pal"><span class="lab">${t('base')}</span>${BASES.map(c => `<button class="sw ${c === base ? 'on' : ''}" data-b="${c}" style="background:${c}"></button>`).join('')}</div>
      <div class="pal"><span class="lab">${t('icing')}</span>${ICES.map(c => `<button class="sw ${c === ice ? 'on' : ''}" data-i="${c}" style="background:${c}"></button>`).join('')}</div>

function xoTick() {

function xoPeers() {

function xoRenderLobby(force) {

function xoInvite(id) {

function xoNew(id, mySym, opp, oppName) {
  XO.game = { id, mySym, opp, oppName, board: Array(9).fill(''), turn: 'X', over: false, win: null, line: null, left: false, score: { me: 0, opp: 0, draw: 0 }, myAgain: false, oppAgain: false, seen: performance.now() };
  XO.inv = null; XO.state = 'game'; xoRenderGame();
}
function xoCheck(g) {
  for (const l of XO_LINES) { const a = l[0], b = l[1], c = l[2]; if (g.board[a] && g.board[a] === g.board[b] && g.board[a] === g.board[c]) { g.win = g.board[a]; g.line = l; g.over = true; if (g.win === g.mySym) { g.score.me++; burst(); } else g.score.opp++; return; } }

}
function xoMove(c) {
  const g = XO.game; if (!g || g.over || g.turn !== g.mySym || g.board[c]) return;
  g.board[c] = g.mySym; g.turn = g.mySym === 'X' ? 'O' : 'X'; xoCheck(g);
  gsend({ t: 'move', to: g.opp, g: g.id, c }); xoRenderGame();
}
function xoRestart() {
  const g = XO.game; g.board = Array(9).fill(''); g.turn = 'X'; g.over = false; g.win = null; g.line = null; g.mySym = g.mySym === 'X' ? 'O' : 'X'; g.myAgain = g.oppAgain = false; g.seen = performance.now(); xoRenderGame();
}
function xoRenderGame() {
  const g = XO.game; if (!g || !XO.on) return;
  mbody.innerHTML = '<div class="xo-head"><div class="xo-who" id="xoMe"></div><div class="xo-who" id="xoOpp"></div></div><div class="xo-status" id="xoSt"></div><div class="xo-board" id="xoBd"></div><div class="row" style="justify-content:center;margin-top:8px" id="xoBtns"></div>';

  [[me, g.score.me], [op, g.score.opp]].forEach(p => { const b = document.createElement('b'); b.textContent = p[1]; p[0].appendChild(b); });
  let st;
  if (g.over) { if (g.left) st = t('xoLeft'); else if (g.win === 'draw') st = t('xoDraw'); else if (g.win === g.mySym) st = t('xoWin'); else st = g.oppName + ' ' + t('xoLose'); }
  else st = myTurn ? t('xoYourTurn') : t('xoTheirTurn') + ' ' + g.oppName + '…';
  if (g.over && !g.left && g.myAgain) st += '\n' + t('xoWaitAgain');
  $('#xoSt').textContent = st; $('#xoSt').style.whiteSpace = 'pre-line';
  const bd = $('#xoBd');
  for (let c = 0; c < 9; c++) {
    const b = document.createElement('button'); b.className = 'xo-cell' + (g.board[c] ? ' ' + g.board[c].toLowerCase() : '') + (g.line && g.line.indexOf(c) >= 0 ? ' win' : '');

  const bt = $('#xoBtns');
  if (g.over && !g.left && !g.myAgain) { const a = document.createElement('button'); a.className = 'btn go'; a.textContent = '🔁 ' + t('xoAgain'); a.onclick = () => { g.myAgain = true; gsend({ t: 'again', to: g.opp, g: g.id }); if (g.oppAgain) xoRestart(); else xoRenderGame(); }; bt.appendChild(a); }

}
function onGame(d) {
  if (!XO.on || !session || !d) return;
  const from = cleanText(d.i, 24); if (!from || from === S.id) return;
  const nm = (session.remotes[from] && session.remotes[from].name) || cleanText(d.n, 16) || '?', now = performance.now();
  if (d.t === 'hello') {
    XO.peers[from] = { n: nm, st: d.st === 'busy' ? 'busy' : 'free', t: now };
    if (XO.game && XO.game.opp === from) XO.game.seen = now;
    if (!XO.game) xoRenderLobby(false); return;
  }
  if (d.to !== S.id) return;
  const gid = cleanText(d.g, 24), g = XO.game;
  if (d.t === 'start') {
    if (g && !g.over) { gsend({ t: 'busy', to: from, g: gid }); return; }
    if (XO.inv) { if (XO.inv.to === from && S.id > from) { XO.inv = null; } else return; }
    gsend({ t: 'ack', to: from, g: gid }); xoNew(gid, 'O', from, nm);
  } else if (d.t === 'ack') {
    if (XO.inv && XO.inv.g === gid && XO.inv.to === from) xoNew(gid, 'X', from, nm);

    if (XO.inv && XO.inv.g === gid) { XO.inv = null; toast(t('xoNoAnswer')); xoRenderLobby(true); }
  } else if (g && g.id === gid && g.opp === from) {
    g.seen = now;
    if (d.t === 'move') {
      const c = d.c | 0, oppSym = g.mySym === 'X' ? 'O' : 'X';
      if (c >= 0 && c <= 8 && !g.over && g.turn === oppSym && !g.board[c]) { g.board[c] = oppSym; g.turn = g.mySym; xoCheck(g); xoRenderGame(); }
    } else if (d.t === 'again') { g.oppAgain = true; if (g.myAgain) xoRestart(); }
    else if (d.t === 'leave') { g.over = true; g.left = true; xoRenderGame(); }
  }
}

/* ============================================================
   APLICAȚIE INSTALABILĂ (PWA)
   ============================================================ */
let deferredInstall = null;
const isStandalone = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
function updateInstallUI() {
  const b = $('#btnInstall'), h = $('#iosHint'); if (!b || !h) return;
  b.textContent = '📲 ' + t('install'); h.textContent = t('iosHint');
  b.style.display = (deferredInstall && !isStandalone()) ? 'inline-block' : 'none';
  h.style.display = (isIOS() && !isStandalone()) ? 'block' : 'none';
}
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredInstall = e; updateInstallUI(); });
window.addEventListener('appinstalled', () => { deferredInstall = null; updateInstallUI(); });
$('#btnInstall').onclick = async () => { if (!deferredInstall) return; deferredInstall.prompt(); try { await deferredInstall.userChoice; } catch (e) {} deferredInstall = null; updateInstallUI(); };
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) { window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); }); }

function boot() {
  initMenu(); initHud();
  new Phaser.Game({
    type: Phaser.AUTO, parent: 'game', backgroundColor: '#9bd77a',
    scale: { mode: Phaser.Scale.RESIZE, width: window.innerWidth, height: window.innerHeight },
    render: { antialias: true, roundPixels: true },
    scene: { create: onCreate, update: onUpdate }
  });
}
Promise.race([document.fonts && document.fonts.load ? document.fonts.load('600 18px Fredoka') : Promise.resolve(), new Promise(r => setTimeout(r, 1500))]).then(boot, boot);
</script>
